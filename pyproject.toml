[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egrag"
version = "0.1.0"
description = "Evidence Graph Retrieval-Augmented Generation: a modular, generator-agnostic RAG framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EG-RAG contributors" }]
keywords = ["rag", "evidence-graph", "retrieval", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
retrieval = ["rank-bm25>=0.2"]
dense = ["sentence-transformers>=2.2"]
graph = ["networkx>=3.0"]
local-models = ["transformers>=4.40", "torch>=2.0"]
http-models = ["httpx>=0.27"]
experiments = ["numpy>=1.26"]
benchmarks = ["pyarrow>=15"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
all = [
    "rank-bm25>=0.2",
    "sentence-transformers>=2.2",
    "networkx>=3.0",
    "transformers>=4.40",
    "torch>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.scripts]
egrag = "egrag.cli.main:app"

[project.urls]
Documentation = "https://example.invalid/egrag/docs"
Source = "https://example.invalid/egrag"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/egrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --cov=egrag --cov-report=term-missing"
markers = [
    "unit: isolated unit tests",
    "integration: tests across adjacent stages",
    "e2e: full pipeline tests",
    "property: Hypothesis property-based tests",
    "sanity: scientific-integrity invariant tests",
    "requires_retrieval: needs the 'retrieval' extra",
    "requires_dense: needs the 'dense' extra",
    "requires_graph: needs the 'graph' extra",
    "requires_local_models: needs the 'local-models' extra",
    "requires_http_models: needs the 'http-models' extra",
    "requires_benchmarks: needs the 'benchmarks' extra",
]

[tool.coverage.run]
source = ["egrag"]
branch = true
